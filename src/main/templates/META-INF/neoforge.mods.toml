license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Antigravity AI"
description='''
Gemini-powered AI Companion Bots for Minecraft 26.3 (NeoForge).
Spawn intelligent AI players that walk, mine, craft, build, fight, and take natural-language requests in multiplayer chat.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
