license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="bradswackhamer-png"
description='''
Intelligent AI Companion Bots for Minecraft 26.3 (NeoForge).
Powered by Google Gemini and Offline Tactical Heuristics. Spawn fully autonomous companions that farm crops, breed livestock, mine ores, chop wood, craft tools, build shelters, defend compounds, and converse in natural-language multiplayer chat!
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
